// Upscaler quality comparison sweep.
//
//   HOME   run the sweep
//   END    restore settings / abort a sweep in progress
//
// Writes nine PNGs to <gamedir>/screenshots/compare/<date>_<time>_<map>_<n>/,
// all at display resolution so they diff directly against each other:
//
//   0_native_100    no upscaling, viewsize 100      render = display
//   1_taau_50       no upscaling, viewsize 50       render = display / 2
//   2_fsr_50        FSR,          viewsize 50       render = display / 2
//   3_ai_2x_taa     QuickSRNet 2x, flt_taa 2        render = display / 2
//   4_ai_2x_notaa   QuickSRNet 2x, flt_taa 0        render = display / 2
//   5_taau_25       no upscaling, viewsize 25       render = display / 4
//   6_fsr_25        FSR,          viewsize 25       render = display / 4
//   7_ai_4x_taa     QuickSRNet 4x, flt_taa 2        render = display / 4
//   8_ai_4x_notaa   QuickSRNet 4x, flt_taa 0        render = display / 4
//
// The AI upscaler picks its own render extent (display / scale) and ignores
// viewsize, so 2x is already the viewsize 50 render cost and 4x the viewsize
// 25 cost -- the pairs above are matched by construction.
//
// The notaa pair exists because the model is purely spatial -- single frame, no
// temporal component -- so TAA is the only thing suppressing per-pixel temporal
// noise before the model ever sees the frame.  These shots are what that
// dependency costs.  vkpt_taa() still runs with flt_taa 0 (main.c:3378) but
// asvgf_taau.comp passes the frame through untouched (:195-198), so TAA_OUTPUT
// is still valid input -- just un-antialiased and un-denoised temporally.
// Nothing else changes: extent_taa_output is pinned to the render extent for
// the upscaler regardless of flt_taa, so the notaa shot costs no NPU session
// rebuild and lands on exactly the same extent as the shot before it.
//
// Stand still and keep the console closed for the whole run.  It takes about
// 25 seconds of client frames, plus a few seconds each time the NPU session is
// rebuilt, during which the client freezes.
//
// Macros are written ${name} rather than $name throughout: an unbraced macro
// name runs to the next space, so $cap_dir/0_native would be parsed as one
// name and expand to nothing.

// Rendered frames to settle after each switch.  Cbuf_Frame can only tick once
// per main-loop iteration, so this counts rendered frames whenever the renderer
// is the bottleneck -- which is what TAA convergence actually depends on.
//
// 120 is where the pre-switch history falls below the noise floor of an 8-bit
// PNG: flt_taa_history_weight is 0.95, so the residual after N frames is
// 0.95^N, and 0.95^120 = 0.2% -- under one 8-bit code word (1/255 = 0.39%).
// 60 frames only reaches 4.6%, which is visible.  Raise it if you change
// flt_taa_history_weight.
set cap_settle 120

// Distinguishes sweeps run within the same minute on the same map.
set cap_run 1

// Seconds the on-screen progress line stays up.  It is blanked before each
// capture regardless, so this only controls how long you see it for.
set cap_notify 3

// Re-entrancy guard.  Pressing HOME twice used to run cap_save a second time
// mid-sweep, which overwrote every saved value with the sweep's own settings --
// so the restore put the sweep's state back instead of yours.  Cleared by
// cap_restore, so END always makes HOME work again.
set cap_active 0

// Puts everything the sweep touches back to the engine defaults, rather than to
// whatever you happened to have.  This is deliberate: the previous version saved
// your real values first and restored those, which broke the moment a sweep died
// between cap_begin and cap_restore -- the next run then saved the *sweep's*
// settings as your "originals" and faithfully restored those instead.  Defaults
// cannot be poisoned that way, and are always a sane place to land.
alias cap_restore "set flt_upscaling 0; set viewsize 100; set scr_draw2d 2; set drs_enable 0; set flt_taa 2; set flt_upscaler_render_scale 0; set con_notifytime 3; set pt_accumulation_rendering 1; cap_unfreeze; set cap_active 0; echo capture: reset to defaults"

// Everything the comparison has to hold constant.  drs_enable 0 is mandatory:
// dynamic resolution moves the render extent every frame, and the NPU upscaler
// disables itself outright rather than rebuilding its session per frame.
//
// cap_dir is resolved once, here, rather than per shot -- ${com_time} is
// minute-resolution and a sweep can cross a minute boundary, which would
// scatter the set across two directories.
//
// Note scr_draw2d 0 does NOT suppress console text: Con_DrawConsole() is called
// outside SCR_Draw2D() (screen.c:2183), so notify lines draw over the frame and
// land in the screenshot.  That is what cap_show / cap_hide below deal with.
//
// Nothing here touches the mouse, on purpose.  cap_freeze already blocks it:
// CL_UpdateCmd() returns immediately when sv_paused is set, before it adjusts
// view angles, reads the keyboard or calls CL_MouseMove().  So pausing freezes
// look, movement and firing in one go, and the camera cannot drift between
// shots.
//
// Two earlier attempts here were wrong and are worth not repeating:
//
//   in_enable 0     -- IN_GetCurrentGrab() never consults it and returns true
//                      unconditionally in fullscreen (input.c:78-79), so any of
//                      the nine IN_Activate() callers re-grabs the mouse
//                      mid-sweep and it starts working again.
//
//   sensitivity 0   -- works, but sensitivity is CVAR_ARCHIVE.  A sweep that
//                      dies between cap_begin and cap_restore leaves 0 in
//                      q2config.cfg, and from then on every run saves 0 as the
//                      "original" and faithfully restores a dead mouse.  Never
//                      park a broken value in an archived cvar.
alias cap_begin "set cap_dir ${com_date}_${com_time}_${cl_mapname}_${cap_run}; set gl_screenshot_message 1; set scr_draw2d 0; set cap_active 1; set pt_accumulation_rendering 0; cap_freeze; set drs_enable 0; set flt_taa 2; set flt_upscaler_render_scale 0; set flt_fsr_easu 1; set flt_fsr_rcas 1; cap_show; echo capture: writing screenshots/compare/${cap_dir}"

// Progress is drawn as console notify text, which is also what would pollute
// the captures -- so it is switched off right before each shot.  Setting
// con_notifytime 0 retroactively hides messages already on screen, because
// SCR_FadeAlpha returns 0 as soon as visTime is 0, so one rendered frame later
// the frame is clean.  The wait is what guarantees that frame actually renders
// before screenshotpng copies the swap chain.
alias cap_show "set con_notifytime ${cap_notify}"
alias cap_hide "set con_notifytime 0; wait 3"

// Freezing the world for the duration of a sweep.  check_paused() polls
// cl_paused every server frame (server/main.c:1737-1772) and skips the game
// frame entirely when it is set, so monsters, projectiles, doors and particles
// all stop -- without a map reload, so the viewpoint survives.
//
// This does NOT stall the capture.  TAA jitter and the checkerboard parity key
// off qvk.frame_counter (main.c:3006, :2912), which increments per rendered
// frame at main.c:3857 and has nothing to do with cl.time -- so the renderer
// keeps accumulating while paused.  It is in fact the ideal case: a perfectly
// static scene never invalidates TAA or ASVGF history through motion.
//
// cl_paused is CVAR_ROM (common.c:900) so it cannot be set directly; `pause` is
// the only way in, and it toggles.  The `if` guard makes that idempotent, so a
// sweep started from an already-paused game still ends up unpaused.  Value 2 is
// the manual pause -- 1 is the automatic console/menu one, which
// CL_CheckForPause clears the moment the console closes (main.c:3133-3136).
//
// Single player only: check_paused() bails unless there is exactly one client.
//
// CRITICAL: pt_accumulation_rendering must be 0 while paused.  Photo mode
// triggers on exactly the state this creates -- is_accumulation_rendering_active()
// is cl_paused == 2 && sv_paused && pt_accumulation_rendering > 0
// (main.c:2594-2597) -- and it defaults to 1.  If it fires it turns the
// denoiser off, forces 2 bounces and reflect_refract >= 4, pins the render
// scale to >= 100% (main.c:3503), draws its own overlay text outside
// SCR_Draw2D() so scr_draw2d 0 will not hide it, and above all makes
// upscaler_active_this_frame() return false (main.c:246-249) -- silently
// disabling the very thing this sweep exists to measure.  cap_begin zeroes it
// and cap_restore puts it back.
alias cap_freeze "if ${cl_paused} != 2 then pause"
alias cap_unfreeze "if ${cl_paused} == 2 then pause"

// Monster removal.  nomonsters is a spawn-time filter in the game DLL: it frees
// every entity whose classname contains "monster", plus misc_deadsoldier and
// misc_insane (g_spawn.c:618-622).  It only runs as entities spawn, so the map
// has to be reloaded -- which respawns you at the start, so do this BEFORE
// walking to the viewpoint you want to capture, not from inside a sweep.
//
// Note it also removes the corpse props, so the scene is not only monster-free
// but missing some set dressing.  cap_monsters puts them all back.
alias cap_nomonsters "set nomonsters 1; map ${cl_mapname}"
alias cap_monsters "set nomonsters 0; map ${cl_mapname}"

// TAA on/off.  cap_notaa deliberately touches nothing but flt_taa: the render
// extent is unchanged, so flipping it does not cost an NPU session rebuild the
// way going through flt_upscaling would.  Every mode below re-asserts cap_taa
// so a sweep cannot inherit flt_taa 0 from the step before it.
alias cap_taa "set flt_taa 2"
alias cap_notaa "set flt_taa 0"

// The modes.  Usable on their own from the console to inspect one config.
// The AI ones go via 0 first so the model index really changes, which is what
// clears a sticky load failure left over from an earlier run.
alias cap_native "cap_taa; set flt_upscaling 0; set viewsize 100"
alias cap_taau50 "cap_taa; set flt_upscaling 0; set viewsize 50"
alias cap_taau25 "cap_taa; set flt_upscaling 0; set viewsize 25"
alias cap_fsr50 "cap_taa; set flt_upscaling 1; set viewsize 50"
alias cap_fsr25 "cap_taa; set flt_upscaling 1; set viewsize 25"
alias cap_ai2x "cap_taa; set flt_upscaling 0; set flt_upscaling 2"
alias cap_ai4x "cap_taa; set flt_upscaling 0; set flt_upscaling 3"

// The taau_ shots above are stock Q2RTX: flt_taa 2 means TAAU reconstructs to
// display resolution, so they are not a plain filtered blit.  Uncomment these
// for a true filtered-blit baseline instead.
// alias cap_bilin50 "set flt_upscaling 0; set flt_taa 1; set viewsize 50"
// alias cap_bilin25 "set flt_upscaling 0; set flt_taa 1; set viewsize 25"

// The chain.  wait defers the rest of the command buffer, so each step's
// screenshot lands cap_settle frames after its switch rather than on the
// same frame.
// No wait after cap_begin: it only sets cvars, and cap_s0 switches mode and
// then waits anyway, so that wait covers cap_begin's changes too.
// Each step: show progress on screen, switch mode, settle, blank the overlay,
// shoot, hand off to the next step.  cap_hide costs 3 frames per step.
alias cap_sweep "if ${cap_active} == 1 then echo capture: already running -- press END to abort; if ${cap_active} == 0 then cap_start"
alias cap_start "cap_begin; cap_s0"
alias cap_s0 "cap_show; echo capture:  11% - 1/9 native 100; cap_native; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/0_native_100; cap_s1"
alias cap_s1 "cap_show; echo capture:  22% - 2/9 taau 50; cap_taau50; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/1_taau_50; cap_s2"
alias cap_s2 "cap_show; echo capture:  33% - 3/9 fsr 50; cap_fsr50; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/2_fsr_50; cap_s3"
alias cap_s3 "cap_show; echo capture:  44% - 4/9 ai 2x taa; cap_ai2x; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/3_ai_2x_taa; cap_s4"
alias cap_s4 "cap_show; echo capture:  56% - 5/9 ai 2x no taa; cap_notaa; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/4_ai_2x_notaa; cap_s5"
alias cap_s5 "cap_show; echo capture:  67% - 6/9 taau 25; cap_taau25; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/5_taau_25; cap_s6"
alias cap_s6 "cap_show; echo capture:  78% - 7/9 fsr 25; cap_fsr25; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/6_fsr_25; cap_s7"
alias cap_s7 "cap_show; echo capture:  89% - 8/9 ai 4x taa; cap_ai4x; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/7_ai_4x_taa; cap_s8"
alias cap_s8 "cap_show; echo capture: 100% - 9/9 ai 4x no taa; cap_notaa; wait ${cap_settle}; cap_hide; screenshotpng compare/${cap_dir}/8_ai_4x_notaa; cap_end"

// Restores everything the sweep touched, then leaves the viewport at 25% --
// change cap_final_vs if you want to land somewhere else.  Note this has no
// visible effect if cap_restore put an AI mode back, since the upscaler picks
// its own render extent and ignores viewsize.  END still restores the original.
set cap_final_vs 25
alias cap_end "cap_restore; set viewsize ${cap_final_vs}; inc cap_run; echo capture: sweep complete, viewsize ${cap_final_vs}"

bind HOME "cap_sweep"
bind END "cap_restore"
