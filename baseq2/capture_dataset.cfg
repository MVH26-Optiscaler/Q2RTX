// Training-data capture preset for the NPU upscaler.
//
//   exec capture_dataset.cfg
//
// Then start the scan. With no arguments it visits every map the filesystem can
// see, including the ones inside pak0.pak:
//   capture_scan
// or over a list of maps, which it loads in order:
//   capture_scan base1 base2 mine1 city1
//
// The q2rtx_capture build runs both of those by itself and exits when done.
//
// Tiles land in <gamedir>/screenshots/dataset/ as 16-bit linear PNGs, one line
// per tile in manifest.jsonl. Turn them into training pairs with
// scripts/upscaler_dataset.py.
//
// Run the game at a high resolution -- 3840x2160 if the machine can take it.
// The tiles are crops at native scale, not resizes of the frame, so at 1920x1080
// a 512 tile is a quarter of the screen and the samples all look alike.

// No upscaling of any kind: the whole point is native-resolution ground truth.
// flt_upscaling drives the other two, so it goes last.
flt_upscaler_enable 0
flt_fsr_enable 0
flt_upscaling 0
drs_enable 0
// The render scale cvar is named 'viewsize'; scr_viewsize is only the C name.
viewsize 100

// Max path tracing quality. Accumulation ("photo mode") is deliberately left
// off: it renders a still frame over hundreds of samples, which is cleaner than
// anything the model will ever be asked to upscale at runtime.
pt_accumulation_rendering 0
pt_num_bounce_rays 2
pt_caustics 1
pt_enable_particles 1
pt_enable_surface_lights 1
pt_bsp_sky_lights 1
flt_enable 1
tm_enable 1

// The view weapon is in frame at runtime, so it belongs in the training data.
// It is on by default and this build has no cl_gun cvar to force it with.

// The bot teleports with 'setpos' and stands around in the open with noclip on,
// neither of which the game allows without this.
cheats 1

// The scan jumps between unrelated levels, so every load is a full restart.
// Without this the server refuses 'map' and shuts down instead.
sv_allow_map 1

// Nothing is driving this from a keyboard, and the window must not take the
// mouse away from whatever else is running on the machine.
in_enable 0

// Native 4K. A 512 tile is a crop at render scale, not a resize of the frame, so
// at 1080p the samples are quarter-screen and all look alike. Drop to
// 2560x1440 if the frame rate makes the run take too long.
//
// The q2rtx_capture build renders headless (vid_driver headless, no window and
// no display connection), so this is the real render resolution rather than a
// request a compositor is free to clamp to the size of the monitor. Ask for a
// window instead with "+set vid_driver sdl" on the command line -- it has to be
// there and not here, because the video driver is chosen before this file runs.
vid_fullscreen 0
vid_geometry 3840x2160

// Nothing is being displayed, so there is nothing to tear: never block the
// capture on a display refresh.
vid_vsync 0

// 512 is the model's output tile. Tiles are taken from a jittered grid of
// disjoint cells, so a 3840x2160 frame can yield 7x4 = 28 of them; asking for 24
// leaves headroom for the ones rejected as too flat. At 1920x1080 the same frame
// only holds 3x2 = 6, which is the single biggest reason to capture at 4K.
capture_tile 512
capture_tiles_per_frame 24
capture_min_stddev 0.02

// Hold still for 16 rendered frames before each shot so the path tracer and TAA
// have converged, then look somewhere else. 6 looks per stop, 60 shots per map,
// which works out to 10 teleports per map.
//
// Sizing, at ~1 MB per 16-bit tile and ~20 tiles surviving per shot:
//   3 demo maps  x 60 shots = ~3600 tiles, ~3.5 GB per pass
//   40 full maps x 60 shots = ~48000 tiles, ~48 GB per pass  <-- lower it first
// scripts/capture_pipeline.py --passes N repeats the whole scan with a fresh
// seed, which is how to grow the set when there are only a few maps to visit.
capture_settle 16
capture_looks 6
capture_samples 60

echo "capture preset loaded -- run 'capture_scan [map ...]' to start collecting"
