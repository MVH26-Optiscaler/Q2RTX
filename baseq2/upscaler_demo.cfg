// Demo binds for the upscaler presentation.
//
//   F1   no upscaling      render 100%
//   F2   NPU upscaler 2x   render 50%
//   F3   NPU upscaler 4x   render 25%
//   F4   FSR               render 50%
//   F5   FSR               render 25%
//
// The pairs are matched by render cost, which is the only comparison that means
// anything: F2 vs F4 both trace at 50%, F3 vs F5 both trace at 25%.  So it is
// two A/B switches, one per quality tier, with F1 as the reference above both.
// The AI modes derive their extent from the model scale and ignore viewsize;
// the FSR ones get there via viewsize, which is why the numbers differ in the
// cvars but not on screen.
//
// TAA is forced on in every mode, including FSR.  Neither upscaler here has a
// temporal component: the QuickSRNet model is single-frame, and FSR 1.0 is
// EASU + RCAS, which reads no motion vectors and keeps no history -- fsr.c
// references only its own EASU/RCAS output images.  Both are spatial filters
// bolted to the end of a path tracer, so TAA is the only thing stabilising
// what they receive.  Turning it off makes stills look sharper and makes
// motion shimmer, which is the worst possible trade for a live demo.
//
// This overrides the F1-F5 binds from q2rtx.cfg (help, savegame, loadgame,
// options, video) for the session.  F6 and up are left alone, so quicksave,
// photomode and the F12 screenshot still work during a demo.
//
// Expect a multi-second freeze switching to or between the AI modes: the ONNX
// session is dropped on every model change and the HTP graph is rebuilt on the
// next frame.  F1 <-> F5 is instant.  Press F2 and F3 once before going live so
// the audience does not watch the first rebuild.

// State every demo mode needs.  drs_enable especially: dynamic resolution moves
// the render extent every frame, so the NPU upscaler disables itself outright
// rather than rebuilding per frame, and it stays disabled until reselected.
alias demo_base "set flt_taa 2; set drs_enable 0; set flt_upscaler_render_scale 0; set flt_fsr_easu 1; set flt_fsr_rcas 1"

// The AI modes go via flt_upscaling 0 first so the model index really changes,
// which is what clears a sticky session-load failure from an earlier attempt.
alias demo_off "demo_base; set flt_upscaling 0; set viewsize 100; echo DEMO   no upscaling   render 100%"
alias demo_2x "demo_base; set flt_upscaling 0; set flt_upscaling 2; echo DEMO   NPU upscaler 2x   render 50%"
alias demo_4x "demo_base; set flt_upscaling 0; set flt_upscaling 3; echo DEMO   NPU upscaler 4x   render 25%"
alias demo_fsr50 "demo_base; set flt_upscaling 1; set viewsize 50; echo DEMO   FSR 50   render 50%"
alias demo_fsr25 "demo_base; set flt_upscaling 1; set viewsize 25; echo DEMO   FSR 25   render 25%"

bind F1 demo_off
bind F2 demo_2x
bind F3 demo_4x
bind F4 demo_fsr50
bind F5 demo_fsr25
